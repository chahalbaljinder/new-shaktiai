[phases.setup]
nixPkgs = ["python3", "postgresql_16.dev", "ffmpeg", "gcc", "pkg-config"]

[phases.install]
cmds = [
    "python -m venv --copies /opt/venv",
    ". /opt/venv/bin/activate && pip install --upgrade pip",
    ". /opt/venv/bin/activate && pip install -r requirements.txt"
]

[start]
cmd = ". /opt/venv/bin/activate && uvicorn backend_service:app --host 0.0.0.0 --port $PORT"

[variables]
PYTHON_VERSION = "3.11"
